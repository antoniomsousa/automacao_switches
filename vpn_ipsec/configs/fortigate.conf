# FortiGate (site A) - route-based IPsec VPN to the Palo Alto (site B), FortiOS 7.x CLI.
# Same objects and order as vpn_ipsec/fortigate.py creates through the REST API, with the values of params.yaml.
# Paste in the CLI (or a config script). Replace <PSK> with the pre-shared key.

config firewall address
    edit "FGT-PA-local"
        set subnet 10.10.0.0 255.255.255.0
        set comment "LAN FGT-PA"
    next
    edit "FGT-PA-remote"
        set subnet 10.20.0.0 255.255.255.0
        set comment "Remote LAN FGT-PA"
    next
end

# Phase 1: IKEv2, AES-256 / SHA-256 / DH 14, 8 h
config vpn ipsec phase1-interface
    edit "VPN-TO-PA"
        set type static
        set interface "port1"
        set ike-version 2
        set peertype any
        set net-device disable
        set proposal aes256-sha256
        set dhgrp 14
        set keylife 28800
        set remote-gw 198.51.100.1
        set authmethod psk
        set psksecret <PSK>
        set dpd on-idle
        set nattraversal enable
    next
end

# Phase 2: ESP AES-256 / SHA-256, PFS DH 14, 1 h. Selectors = the two LANs (mirror of the Palo Alto proxy-ID)
config vpn ipsec phase2-interface
    edit "VPN-TO-PA-P2"
        set phase1name "VPN-TO-PA"
        set proposal aes256-sha256
        set pfs enable
        set dhgrp 14
        set keylifeseconds 3600
        set src-addr-type name
        set src-name "FGT-PA-local"
        set dst-addr-type name
        set dst-name "FGT-PA-remote"
    next
end

# Tunnel interface (created by the phase1-interface): 169.255.1.1, peer 169.255.1.2 on the /30
config system interface
    edit "VPN-TO-PA"
        set ip 169.255.1.1 255.255.255.255
        set remote-ip 169.255.1.2 255.255.255.252
        set allowaccess ping
    next
end

# Route to the remote LAN through the tunnel; blackhole (distance 254) keeps that traffic off the WAN if the tunnel drops
config router static
    edit 0
        set dst 10.20.0.0 255.255.255.0
        set device "VPN-TO-PA"
        set comment "FGT-PA route"
    next
    edit 0
        set dst 10.20.0.0 255.255.255.0
        set blackhole enable
        set distance 254
        set comment "FGT-PA blackhole"
    next
end

# Policies in both directions, without NAT
config firewall policy
    edit 0
        set name "FGT-PA-out"
        set srcintf "port2"
        set dstintf "VPN-TO-PA"
        set srcaddr "FGT-PA-local"
        set dstaddr "FGT-PA-remote"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat disable
        set logtraffic all
    next
    edit 0
        set name "FGT-PA-in"
        set srcintf "VPN-TO-PA"
        set dstintf "port2"
        set srcaddr "FGT-PA-remote"
        set dstaddr "FGT-PA-local"
        set action accept
        set schedule "always"
        set service "ALL"
        set nat disable
        set logtraffic all
    next
end

# Verification
# get vpn ipsec tunnel summary
# diagnose vpn ike gateway list name VPN-TO-PA
# diagnose vpn tunnel list name VPN-TO-PA
# execute ping-options source 169.255.1.1
# execute ping 169.255.1.2
