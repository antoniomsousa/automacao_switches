<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>Route-based IPsec VPN between a FortiGate and a Palo Alto firewall</title>
  <defs>
    <!-- Host -->
    <g id="pc">
      <rect x="-22" y="-20" width="44" height="30" rx="3" fill="#ECEFF4" stroke="#4C566A" stroke-width="2"/>
      <rect x="-17" y="-15" width="34" height="20" fill="#88C0D0"/>
      <path d="M-6 10 L-8 18 H8 L6 10 Z" fill="#4C566A"/>
      <rect x="-14" y="18" width="28" height="3" rx="1.5" fill="#4C566A"/>
    </g>
    <!-- Layer 2 switch: box with crossing arrows -->
    <g id="switch">
      <rect x="-40" y="-20" width="80" height="40" rx="6" fill="#1D76BA"/>
      <g stroke="#fff" stroke-width="3" stroke-linecap="round" fill="none">
        <path d="M-26 -7 H22 M14 -13 L22 -7 L14 -1"/>
        <path d="M26 7 H-22 M-14 1 L-22 7 L-14 13"/>
      </g>
    </g>
    <!-- Firewall: brick wall -->
    <g id="wall">
      <rect x="-46" y="-36" width="92" height="72" rx="10"/>
      <g stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round">
        <path d="M-34 -12 H34 M-34 12 H34"/>
        <path d="M-12 -28 V-12 M14 -28 V-12 M-24 -12 V12 M2 -12 V12 M26 -12 V12 M-12 12 V28 M14 12 V28"/>
      </g>
    </g>
  </defs>

  <rect width="1200" height="600" rx="18" fill="#FFFFFF"/>
  <text x="600" y="42" text-anchor="middle" font-size="22" font-weight="700" fill="#2E3440">Route-based IPsec VPN: FortiGate ↔ Palo Alto</text>

  <!-- Sites -->
  <rect x="24" y="70" width="372" height="380" rx="14" fill="#FDF0EF" stroke="#DA291C" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="44" y="98" font-size="15" font-weight="700" fill="#DA291C">SITE A</text>
  <rect x="804" y="70" width="372" height="380" rx="14" fill="#FFF3EE" stroke="#FA582D" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="1156" y="98" text-anchor="end" font-size="15" font-weight="700" fill="#FA582D">SITE B</text>

  <!-- IPsec tunnel over the Internet -->
  <path d="M312 222 C 400 70, 800 70, 888 222" fill="none" stroke="#00A650" stroke-opacity=".22" stroke-width="22" stroke-linecap="round"/>
  <path d="M312 222 C 400 70, 800 70, 888 222" fill="none" stroke="#00A650" stroke-width="2.5" stroke-dasharray="9 6"/>
  <rect x="470" y="96" width="260" height="50" rx="8" fill="#FFFFFF" stroke="#00A650" stroke-width="1.5"/>
  <text x="600" y="117" text-anchor="middle" font-size="14" font-weight="700" fill="#007A3D">IPsec tunnel · IKEv2</text>
  <text x="600" y="136" text-anchor="middle" font-size="13" fill="#2E3440">transit network 169.255.1.0/30</text>

  <!-- Links -->
  <g stroke="#2E3440" stroke-width="2.5">
    <line x1="88" y1="190" x2="150" y2="250"/>
    <line x1="88" y1="330" x2="150" y2="270"/>
    <line x1="190" y1="260" x2="264" y2="260"/>
    <line x1="356" y1="260" x2="500" y2="260"/>
    <line x1="700" y1="260" x2="844" y2="260"/>
    <line x1="936" y1="260" x2="1010" y2="260"/>
    <line x1="1050" y1="250" x2="1112" y2="190"/>
    <line x1="1050" y1="270" x2="1112" y2="330"/>
  </g>

  <!-- Internet -->
  <g fill="#E5E9F0" stroke="#81A1C1" stroke-width="2">
    <path d="M520 290 C 488 290, 488 248, 522 246 C 520 214, 566 204, 584 228 C 598 200, 650 204, 652 234 C 690 226, 704 266, 680 282 C 690 300, 664 312, 646 302 C 630 318, 590 318, 574 304 C 556 316, 524 310, 520 290 Z"/>
  </g>
  <text x="600" y="270" text-anchor="middle" font-size="16" font-weight="700" fill="#4C566A">Internet</text>

  <!-- Site A devices -->
  <use href="#pc" x="70" y="185"/>
  <use href="#pc" x="70" y="325"/>
  <use href="#switch" x="150" y="260"/>
  <use href="#wall" x="310" y="260" fill="#DA291C"/>
  <text x="310" y="318" text-anchor="middle" font-size="16" font-weight="700" fill="#2E3440">FortiGate</text>
  <text x="310" y="336" text-anchor="middle" font-size="12" fill="#4C566A">Fortinet · FortiOS 7.x</text>
  <text x="150" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#2E3440">LAN A</text>
  <text x="150" y="317" text-anchor="middle" font-size="13" fill="#2E3440">10.10.0.0/24</text>
  <text x="228" y="252" text-anchor="middle" font-size="12" fill="#4C566A">port2</text>
  <text x="368" y="252" font-size="12" fill="#4C566A">port1</text>
  <text x="368" y="282" font-size="13" font-weight="600" fill="#2E3440">WAN 203.0.113.1</text>
  <text x="250" y="178" text-anchor="end" font-size="12" fill="#4C566A">tunnel VPN-TO-PA</text>
  <text x="250" y="194" text-anchor="end" font-size="13" font-weight="700" fill="#007A3D">169.255.1.1/30</text>

  <!-- Site B devices -->
  <use href="#pc" x="1130" y="185"/>
  <use href="#pc" x="1130" y="325"/>
  <use href="#switch" x="1050" y="260"/>
  <use href="#wall" x="890" y="260" fill="#FA582D"/>
  <text x="890" y="318" text-anchor="middle" font-size="16" font-weight="700" fill="#2E3440">Palo Alto</text>
  <text x="890" y="336" text-anchor="middle" font-size="12" fill="#4C566A">Palo Alto Networks · PAN-OS 10.x/11.x</text>
  <text x="1050" y="300" text-anchor="middle" font-size="13" font-weight="700" fill="#2E3440">LAN B</text>
  <text x="1050" y="317" text-anchor="middle" font-size="13" fill="#2E3440">10.20.0.0/24</text>
  <text x="972" y="252" text-anchor="middle" font-size="12" fill="#4C566A">trust</text>
  <text x="832" y="252" text-anchor="end" font-size="12" fill="#4C566A">ethernet1/1</text>
  <text x="832" y="282" text-anchor="end" font-size="13" font-weight="600" fill="#2E3440">WAN 198.51.100.1</text>
  <text x="950" y="178" font-size="12" fill="#4C566A">tunnel.10 (zone vpn)</text>
  <text x="950" y="194" font-size="13" font-weight="700" fill="#007A3D">169.255.1.2/30</text>

  <!-- Routes inside each site -->
  <text x="44" y="400" font-size="12" fill="#4C566A">Route 10.20.0.0/24 → VPN-TO-PA</text>
  <text x="44" y="418" font-size="12" fill="#4C566A">Blackhole 10.20.0.0/24 (distance 254)</text>
  <text x="1156" y="400" text-anchor="end" font-size="12" fill="#4C566A">Route 10.10.0.0/24 → tunnel.10</text>
  <text x="1156" y="418" text-anchor="end" font-size="12" fill="#4C566A">Tunnel monitor: ping 169.255.1.1</text>

  <!-- Proposals -->
  <rect x="24" y="470" width="1152" height="106" rx="12" fill="#F4F6F9"/>
  <text x="48" y="500" font-size="14" font-weight="700" fill="#2E3440">Phase 1 (IKE)</text>
  <text x="48" y="522" font-size="13" fill="#2E3440">IKEv2 · pre-shared key · AES-256-CBC · SHA-256 · DH group 14</text>
  <text x="48" y="542" font-size="13" fill="#2E3440">lifetime 28800 s · DPD on · NAT-T on</text>
  <text x="620" y="500" font-size="14" font-weight="700" fill="#2E3440">Phase 2 (IPsec ESP)</text>
  <text x="620" y="522" font-size="13" fill="#2E3440">AES-256-CBC · SHA-256 · PFS group 14 · lifetime 3600 s</text>
  <text x="620" y="542" font-size="13" fill="#2E3440">selectors / proxy-ID: 10.10.0.0/24 ↔ 10.20.0.0/24</text>
  <text x="1152" y="566" text-anchor="end" font-size="11" fill="#7B8394">WAN addresses are documentation ranges (RFC 5737); values from vpn_ipsec/params.yaml</text>
</svg>
