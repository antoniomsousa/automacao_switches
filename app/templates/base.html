<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Switch Wizard Meli{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/switch-automation.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="top">
    <div class="container header-content">
      <a class="brand" href="{{ url_for('switch.form_page') }}">
        {% if company_logo %}
          <img class="company-logo" src="{{ company_logo }}" alt="Mercado Livre">
        {% else %}
          <span class="company-logo-text">mercado<br>livre</span>
        {% endif %}
        <span class="divider"></span>
        <img class="logo-switch" src="{{ url_for('static', filename='img/switch-automation.svg') }}" alt="">
        <span class="title">
          <strong>Switch Wizard</strong>
          <small>Automação de switches</small>
        </span>
      </a>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="footer container">Switch Wizard · Infraestrutura de Redes Meli</footer>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
