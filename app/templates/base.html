<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Switch Wizard Meli{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/switch-automation.svg') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topo">
    <div class="container topo-conteudo">
      <a class="marca" href="{{ url_for('switch.formulario') }}">
        {% if logo_empresa %}
          <img class="logo-empresa" src="{{ logo_empresa }}" alt="Mercado Livre">
        {% else %}
          <span class="logo-empresa-texto">mercado<br>livre</span>
        {% endif %}
        <span class="divisor"></span>
        <img class="logo-switch" src="{{ url_for('static', filename='img/switch-automation.svg') }}" alt="">
        <span class="titulo">
          <strong>Switch Wizard</strong>
          <small>Automação de switches</small>
        </span>
      </a>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="rodape container">Switch Wizard · Infraestrutura de Redes Meli</footer>

  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
