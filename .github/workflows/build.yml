name: Build

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:  # "Run workflow" button in the Actions tab

# A new push cancels the run still in progress for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes-e-sonarcloud:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # SonarCloud needs full history for blame / new-code detection

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -r requirements-dev.txt

      - name: Testes com cobertura
        shell: bash
        run: python -m pytest -v --cov=app --cov-report=xml 2>&1 | tee pytest.log

      - name: Resumo dos testes com falha
        if: failure() || cancelled()
        shell: bash
        # Turn the end of the pytest log into an annotation, visible on the run page
        run: |
          msg=$(tail -n 80 pytest.log | sed -e 's/%/%25/g' -e 's/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=pytest::${msg}"

      - name: SonarCloud
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
